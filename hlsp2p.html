<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="referrer" content="no-referrer">

  <title>ST Player</title>

  <link
    rel="stylesheet"
    href="https://cdn.plyr.io/3.6.2/plyr.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 255, 132, 0.08),
          transparent 45%
        ),
        linear-gradient(
          135deg,
          #020805 0%,
          #000000 70%
        );
    }

    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .plyr {
      --plyr-color-main: #00ff84;
      --plyr-video-control-color: #ffffff;
      --plyr-video-control-color-hover: #031008;
      --plyr-video-control-background-hover: #00ff84;
      --plyr-range-fill-background: #00ff84;
      --plyr-control-radius: 10px;

      width: 100%;
      height: 100%;
      font-family: "Rajdhani", sans-serif;
    }

    .plyr__video-wrapper {
      width: 100%;
      height: 100%;
    }

    .plyr--video .plyr__controls {
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.92),
        rgba(0, 0, 0, 0.55),
        transparent
      ) !important;
    }

    .plyr--video .plyr__control--overlaid {
      left: 50% !important;
      top: 50% !important;
      transform: translate(-50%, -50%) !important;
      background: rgba(0, 255, 132, 0.92) !important;
      color: #031008 !important;
      box-shadow:
        0 0 30px rgba(0, 255, 132, 0.45);
    }

    .plyr__control:hover {
      background: #00ff84 !important;
      color: #031008 !important;
    }

    .plyr__menu__container {
      background: #06120c !important;
      border:
        1px solid rgba(0, 255, 132, 0.25) !important;
      color: #fff !important;
      box-shadow:
        0 14px 40px rgba(0, 0, 0, 0.6);
    }

    .plyr__menu__container .plyr__control {
      color: #ffffff !important;
    }

    .plyr__menu__container .plyr__control:hover {
      color: #031008 !important;
    }

    /* SPORTSTRACK watermark */

    #hx-watermark {
      position: absolute;
      left: 50%;
      bottom: 62px;
      z-index: 5;

      display: flex;
      align-items: center;
      gap: 8px;

      transform: translateX(-50%);
      opacity: 0.42;
      pointer-events: none;

      transition:
        opacity 0.3s,
        bottom 0.3s;

      font-family: "Rajdhani", sans-serif;
      text-align: center;
    }

    #hx-watermark .wm-rule {
      width: 22px;
      height: 1px;
      background:
        linear-gradient(
          90deg,
          transparent,
          #00ff84
        );
    }

    #hx-watermark .wm-rule.right {
      background:
        linear-gradient(
          90deg,
          #00ff84,
          transparent
        );
    }

    #hx-watermark .wm-text {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #hx-watermark .wm-name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 15px;
      letter-spacing: 4px;
      color: #fff;
      text-shadow:
        0 0 14px rgba(0, 255, 132, 0.35);
    }

    #hx-watermark .wm-name .r {
      color: #00ff84;
    }

    #hx-watermark .wm-url {
      margin-top: 2px;
      font-size: 9px;
      letter-spacing: 3px;
      color: #b8c9c1;
    }

    .plyr:fullscreen #hx-watermark,
    .plyr:-webkit-full-screen #hx-watermark {
      bottom: 70px;
      opacity: 0.5;
    }

    @media (max-width: 600px) {
      #hx-watermark {
        bottom: 58px;
        gap: 7px;
      }

      #hx-watermark .wm-name {
        font-size: 13px;
        letter-spacing: 3px;
      }

      #hx-watermark .wm-url {
        font-size: 8px;
        letter-spacing: 2px;
      }

      #hx-watermark .wm-rule {
        width: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="player-wrap">
    <video
      id="player"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      muted>
    </video>
  </div>

  <!-- Exact versions used by the working test player -->

  <script
    src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/p2p-media-loader-hlsjs@3.0.1/dist/p2p-media-loader-hlsjs.iife.min.js">
  </script>

  <script
    src="https://cdn.plyr.io/3.6.2/plyr.polyfilled.js">
  </script>

  <script>
    (function () {
      "use strict";

      const STREAM_URL =
        "https://media.kukkukkaaka.space/channel1/index.m3u8";

      const TRACKER_URL =
        "wss://tracker.kukkukkaaka.space/announce";

      /*
       * Keep this identical in every player that
       * should join the same P2P swarm.
       */
      const SWARM_ID =
        "kukkukkaaka-channel1";

      const video =
        document.getElementById("player");

      const connectedPeers =
        new Set();

      const stats = {
        httpDownloaded: 0,
        p2pDownloaded: 0,
        p2pUploaded: 0,
        httpSegments: 0,
        p2pSegments: 0,
        startedAt: Date.now()
      };

      let plyrPlayer = null;
      let statsTimer = null;

      function formatBytes(bytes) {
        const value =
          Number(bytes) || 0;

        if (value < 1024) {
          return value.toFixed(0) + " B";
        }

        if (value < 1024 * 1024) {
          return (
            value / 1024
          ).toFixed(2) + " KB";
        }

        if (value < 1024 * 1024 * 1024) {
          return (
            value / 1024 / 1024
          ).toFixed(2) + " MB";
        }

        return (
          value / 1024 / 1024 / 1024
        ).toFixed(2) + " GB";
      }

      function calculateP2PRatio() {
        const total =
          stats.httpDownloaded +
          stats.p2pDownloaded;

        if (total <= 0) {
          return 0;
        }

        return (
          stats.p2pDownloaded /
          total
        ) * 100;
      }

      function extractPeerId(details) {
        if (!details) {
          return "unknown";
        }

        if (typeof details === "string") {
          return details;
        }

        return (
          details.peerId ||
          details.id ||
          "unknown"
        );
      }

      function printP2PStats() {
        const totalDownloaded =
          stats.httpDownloaded +
          stats.p2pDownloaded;

        const runtimeSeconds =
          Math.floor(
            (
              Date.now() -
              stats.startedAt
            ) / 1000
          );

        console.groupCollapsed(
          "[P2P STATS] Peers: " +
          connectedPeers.size +
          " | P2P ratio: " +
          calculateP2PRatio().toFixed(1) +
          "%"
        );

        console.table({
          "Connected peers":
            connectedPeers.size,

          "HTTP downloaded":
            formatBytes(
              stats.httpDownloaded
            ),

          "P2P downloaded":
            formatBytes(
              stats.p2pDownloaded
            ),

          "P2P uploaded":
            formatBytes(
              stats.p2pUploaded
            ),

          "Total downloaded":
            formatBytes(
              totalDownloaded
            ),

          "P2P download ratio":
            calculateP2PRatio()
              .toFixed(1) + "%",

          "HTTP segments":
            stats.httpSegments,

          "P2P segments":
            stats.p2pSegments,

          "Runtime":
            runtimeSeconds + " seconds"
        });

        console.groupEnd();
      }

      /*
       * Run this manually in DevTools:
       *
       * getP2PStats()
       */
      window.getP2PStats =
        function () {
          const totalDownloaded =
            stats.httpDownloaded +
            stats.p2pDownloaded;

          const result = {
            peers:
              connectedPeers.size,

            httpDownloaded:
              formatBytes(
                stats.httpDownloaded
              ),

            p2pDownloaded:
              formatBytes(
                stats.p2pDownloaded
              ),

            p2pUploaded:
              formatBytes(
                stats.p2pUploaded
              ),

            totalDownloaded:
              formatBytes(
                totalDownloaded
              ),

            p2pRatio:
              calculateP2PRatio()
                .toFixed(1) + "%",

            httpSegments:
              stats.httpSegments,

            p2pSegments:
              stats.p2pSegments
          };

          console.table(result);

          return result;
        };

      function addWatermark(player) {
        if (
          document.getElementById(
            "hx-watermark"
          )
        ) {
          return;
        }

        const watermark =
          document.createElement("div");

        watermark.id =
          "hx-watermark";

        watermark.innerHTML =
          '<span class="wm-rule"></span>' +
          '<span class="wm-text">' +
            '<span class="wm-name">' +
              'SPORTS' +
              '<span class="r">TRACK</span>' +
            '</span>' +
            '<span class="wm-url"></span>' +
          '</span>' +
          '<span class="wm-rule right"></span>';

        player.elements.container
          .appendChild(watermark);
      }

      function initializePlyr(hls) {
        if (plyrPlayer) {
          return plyrPlayer;
        }

        const qualities = [];

        hls.levels.forEach(
          function (level) {
            const height =
              Number(level.height);

            if (
              height > 0 &&
              !qualities.includes(height)
            ) {
              qualities.push(height);
            }
          }
        );

        qualities.sort(
          function (a, b) {
            return b - a;
          }
        );

        const options = {
          settings: [
            "quality",
            "speed",
            "fullscreen"
          ],

          fullscreen: {
            enabled: true,
            fallback: true,
            iosNative: true
          }
        };

        if (qualities.length > 0) {
          options.quality = {
            default:
              qualities[0],

            options:
              qualities,

            forced:
              true,

            onChange:
              function (selectedQuality) {
                const targetLevel =
                  hls.levels.findIndex(
                    function (level) {
                      return (
                        Number(
                          level.height
                        ) ===
                        Number(
                          selectedQuality
                        )
                      );
                    }
                  );

                if (targetLevel >= 0) {
                  hls.currentLevel =
                    targetLevel;

                  console.log(
                    "[QUALITY] Selected:",
                    selectedQuality + "p",
                    "Level:",
                    targetLevel
                  );
                }
              }
          };
        }

        plyrPlayer =
          new Plyr(
            video,
            options
          );

        addWatermark(
          plyrPlayer
        );

        document.addEventListener(
          "fullscreenchange",
          function () {
            if (
              document.fullscreenElement &&
              screen.orientation &&
              screen.orientation.lock
            ) {
              screen.orientation
                .lock("landscape")
                .catch(
                  function () {}
                );
            } else if (
              screen.orientation &&
              screen.orientation.unlock
            ) {
              screen.orientation.unlock();
            }
          }
        );

        video.addEventListener(
          "click",
          function () {
            if (!plyrPlayer) {
              return;
            }

            if (plyrPlayer.playing) {
              plyrPlayer.pause();
            } else {
              plyrPlayer.play();
            }
          }
        );

        console.log(
          "[PLAYER] Plyr initialized."
        );

        return plyrPlayer;
      }

      const p2pAvailable =
        window.p2pml &&
        window.p2pml.hlsjs &&
        window.p2pml.hlsjs
          .HlsJsP2PEngine;

      const isIOS =
        /iPad|iPhone|iPod/i.test(
          navigator.userAgent
        );

      /*
       * iPhone/iPad use native HLS.
       * Native HLS does not participate in P2P.
       */
      if (isIOS) {
        console.warn(
          "[P2P] iOS native HLS mode. P2P unavailable."
        );

        video.src =
          STREAM_URL;

        plyrPlayer =
          new Plyr(video, {
            fullscreen: {
              enabled: true,
              fallback: true,
              iosNative: true
            }
          });

        addWatermark(
          plyrPlayer
        );

        return;
      }

      if (
        !window.Hls ||
        !window.Hls.isSupported()
      ) {
        console.error(
          "[PLAYER] Hls.js is not supported."
        );

        return;
      }

      if (!p2pAvailable) {
        console.error(
          "[P2P] P2P Media Loader library did not load."
        );

        return;
      }

      const HlsJsP2PEngine =
        window.p2pml.hlsjs
          .HlsJsP2PEngine;

      const HlsWithP2P =
        HlsJsP2PEngine.injectMixin(
          window.Hls
        );

      const hls =
        new HlsWithP2P({
          /*
           * Four-second segments:
           * eight segments gives approximately
           * 32 seconds behind live.
           */
          liveSyncDurationCount: 8,
          liveMaxLatencyDurationCount: 12,

          maxBufferLength: 60,
          backBufferLength: 60,

          p2p: {
            core: {
              swarmId:
                SWARM_ID,

              announceTrackers: [
                TRACKER_URL
              ],

              rtcConfig: {
                iceServers: [
                  {
                    urls: [
                      "stun:stun.l.google.com:19302",
                      "stun:stun1.l.google.com:19302"
                    ]
                  }
                ]
              },

              highDemandTimeWindow: 8,

              httpDownloadInitialTimeoutMs:
                2000,

              httpDownloadTimeWindow:
                15,

              p2pDownloadTimeWindow:
                90,

              simultaneousHttpDownloads:
                1,

              simultaneousP2PDownloads:
                8,

              webRtcMaxMessageSize:
                65535
            },

            onHlsJsCreated:
              function (hlsInstance) {
                const engine =
                  hlsInstance.p2pEngine;

                console.log(
                  "[P2P] Engine created."
                );

                console.log(
                  "[P2P] Tracker:",
                  TRACKER_URL
                );

                console.log(
                  "[P2P] Swarm:",
                  SWARM_ID
                );

                engine.addEventListener(
                  "onPeerConnect",
                  function (details) {
                    const peerId =
                      extractPeerId(
                        details
                      );

                    connectedPeers.add(
                      peerId
                    );

                    console.log(
                      "[P2P] Peer connected:",
                      peerId,
                      "Total:",
                      connectedPeers.size
                    );

                    printP2PStats();
                  }
                );

                engine.addEventListener(
                  "onPeerClose",
                  function (details) {
                    const peerId =
                      extractPeerId(
                        details
                      );

                    connectedPeers.delete(
                      peerId
                    );

                    console.log(
                      "[P2P] Peer disconnected:",
                      peerId,
                      "Total:",
                      connectedPeers.size
                    );

                    printP2PStats();
                  }
                );

                engine.addEventListener(
                  "onPeerConnectError",
                  function (details) {
                    console.warn(
                      "[P2P] Peer connection error:",
                      details
                    );
                  }
                );

                engine.addEventListener(
                  "onPeerWarning",
                  function (details) {
                    console.warn(
                      "[P2P] Peer warning:",
                      details
                    );
                  }
                );

                engine.addEventListener(
                  "onChunkDownloaded",
                  function (
                    bytesLength,
                    downloadSource,
                    peerId,
                    streamType,
                    infoHash
                  ) {
                    const bytes =
                      Number(
                        bytesLength
                      ) || 0;

                    const source =
                      String(
                        downloadSource || ""
                      ).toLowerCase();

                    const isP2P =
                      source.includes(
                        "p2p"
                      ) ||
                      source.includes(
                        "peer"
                      );

                    if (isP2P) {
                      stats.p2pDownloaded +=
                        bytes;

                      console.log(
                        "[P2P DOWNLOAD]",
                        formatBytes(bytes),
                        {
                          peerId:
                            peerId ||
                            "unknown",

                          streamType:
                            streamType ||
                            "unknown",

                          infoHash:
                            infoHash ||
                            "unknown"
                        }
                      );
                    } else {
                      stats.httpDownloaded +=
                        bytes;

                      console.log(
                        "[HTTP DOWNLOAD]",
                        formatBytes(bytes),
                        {
                          source:
                            downloadSource,

                          streamType:
                            streamType ||
                            "unknown"
                        }
                      );
                    }
                  }
                );

                engine.addEventListener(
                  "onChunkUploaded",
                  function (
                    bytesLength,
                    peerId,
                    streamType,
                    infoHash
                  ) {
                    const bytes =
                      Number(
                        bytesLength
                      ) || 0;

                    stats.p2pUploaded +=
                      bytes;

                    console.log(
                      "[P2P UPLOAD]",
                      formatBytes(bytes),
                      {
                        peerId:
                          peerId ||
                          "unknown",

                        streamType:
                          streamType ||
                          "unknown",

                        infoHash:
                          infoHash ||
                          "unknown"
                      }
                    );
                  }
                );

                engine.addEventListener(
                  "onSegmentLoaded",
                  function (details) {
                    const source =
                      String(
                        details.downloadSource ||
                        ""
                      ).toLowerCase();

                    const isP2P =
                      source.includes(
                        "p2p"
                      ) ||
                      source.includes(
                        "peer"
                      );

                    if (isP2P) {
                      stats.p2pSegments +=
                        1;
                    } else {
                      stats.httpSegments +=
                        1;
                    }

                    console.log(
                      "[SEGMENT LOADED]",
                      {
                        source:
                          details.downloadSource,

                        size:
                          formatBytes(
                            details.bytesLength ||
                            0
                          ),

                        peer:
                          details.peerId ||
                          "none",

                        streamType:
                          details.streamType,

                        url:
                          details.segment &&
                          details.segment.url
                            ? details.segment.url
                            : "unknown"
                      }
                    );

                    printP2PStats();
                  }
                );
              }
          }
        });

      hls.on(
        window.Hls.Events.MEDIA_ATTACHED,
        function () {
          console.log(
            "[HLS] Media attached."
          );

          hls.loadSource(
            STREAM_URL
          );
        }
      );

      hls.on(
        window.Hls.Events.MANIFEST_PARSED,
        function () {
          console.log(
            "[HLS] Manifest parsed.",
            "Levels:",
            hls.levels.length
          );

          initializePlyr(hls);

          video.play().catch(
            function (error) {
              console.log(
                "[PLAYER] Autoplay blocked:",
                error.message
              );
            }
          );
        }
      );

      hls.on(
        window.Hls.Events.LEVEL_SWITCHED,
        function (event, data) {
          const level =
            hls.levels[data.level];

          console.log(
            "[QUALITY] Level switched:",
            {
              index:
                data.level,

              resolution:
                level
                  ? level.width +
                    "x" +
                    level.height
                  : "unknown",

              bitrate:
                level
                  ? level.bitrate
                  : "unknown"
            }
          );
        }
      );

      hls.on(
        window.Hls.Events.ERROR,
        function (event, data) {
          console.error(
            "[HLS ERROR]",
            data
          );

          if (!data.fatal) {
            return;
          }

          if (
            data.type ===
            window.Hls.ErrorTypes
              .NETWORK_ERROR
          ) {
            console.warn(
              "[HLS] Network error. Retrying."
            );

            hls.startLoad();

            return;
          }

          if (
            data.type ===
            window.Hls.ErrorTypes
              .MEDIA_ERROR
          ) {
            console.warn(
              "[HLS] Media error. Recovering."
            );

            hls.recoverMediaError();

            return;
          }

          console.error(
            "[HLS] Fatal error. Player destroyed."
          );

          hls.destroy();
        }
      );

      hls.attachMedia(video);

      window.stPlayerHls =
        hls;

      statsTimer =
        window.setInterval(
          printP2PStats,
          10000
        );

      window.addEventListener(
        "beforeunload",
        function () {
          if (statsTimer) {
            clearInterval(
              statsTimer
            );
          }

          hls.destroy();
        }
      );
    })();
  </script>

</body>
</html>
